<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>إدارة الخزنة</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2>إدارة الخزنة</h2>

<h2>إدارة الخزنة - نسخة مطورة</h2>

<div class="form">

<input type="number" id="id" placeholder="رقم التسلسل">
<input type="date" id="date">

<input type="number" id="income" placeholder="الإيرادات">
<input type="number" id="expense" placeholder="المصروفات">

<input type="text" id="category" placeholder="نوع الحركة">
<input type="text" id="note" placeholder="ملاحظات">

<button onclick="addTransaction()">إضافة</button>
<button onclick="clearAll()">حذف الكل</button>

</div>

<h3>الرصيد الحالي: <span id="balance">0</span></h3>

<button onclick="exportToExcel()">📥 تصدير إلى Excel</button>
<button onclick="exportMonthlyExcel()">📊 تصدير الشهر</button>
<table>
<thead>
<tr>
<th>#</th>
<th>التاريخ</th>
<th>ايجارات</th>
<th>المصروفات</th>
<!-- <th>الرصيد اليومي</th> -->
<th>نوع الحركة</th>
<th>المبلغ</th>
<th>اجمالى</th>
<th>ملاحظات</th>
<th>تحكم

</th>


</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>



<h3>تقرير شهري</h3>
<input type="month" id="month">
<button onclick="monthlyReport()">عرض</button>

<p id="report"></p>
<h3>الرصيد: <span id="balance">0</span></h3>

 
<script src="script.js"></script>
</body>
</html>
